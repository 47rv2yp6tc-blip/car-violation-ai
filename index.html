<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1769e0">
  <meta name="description" content="RoadLens AI - AI 汽車違規影像分析與罰鍰預估系統">
  <title>RoadLens AI｜交通違規影像分析</title>
  <style>
    :root {
      --ink: #10233f;
      --muted: #65758b;
      --line: #dce5ed;
      --bg: #f6f9fc;
      --card: #fff;
      --blue: #1769e0;
      --red: #c7444d;
      --amber: #a66300;
      --green: #147d67;
      --shadow: 0 8px 26px rgba(32, 62, 92, 0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    .shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 18px;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--blue), #1ea7d3);
      color: #fff;
      font-weight: 800;
    }

    .badge {
      background: #ecf3ff;
      color: var(--blue);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 18px;
    }

    .hero {
      text-align: center;
      padding: 12px 0 8px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--blue);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 52px);
      line-height: 1.15;
      letter-spacing: -0.04em;
    }

    .lead {
      margin: 0 auto 20px;
      max-width: 680px;
      color: var(--muted);
      font-size: 16px;
    }

    .upload-area {
      border: 2px dashed var(--line);
      border-radius: 16px;
      background: #fafbfd;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
      user-select: none;
    }

    .upload-area.dragover {
      border-color: var(--blue);
      background: #edf4ff;
    }

    .upload-icon {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .upload-text {
      color: var(--muted);
      font-size: 14px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .primary-btn {
      background: var(--blue);
      color: white;
      box-shadow: 0 12px 18px rgba(23, 105, 224, 0.2);
    }

    .secondary-btn {
      background: white;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .ghost-btn {
      background: #f5f7fb;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .hidden-input {
      display: none;
    }

    #fileList {
      margin-top: 16px;
      display: none;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fafbfd;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      background: white;
      margin-top: 8px;
      border: 1px solid var(--line);
      font-size: 13px;
    }

    .status {
      margin-top: 18px;
      padding: 14px 16px;
      background: #f6f9fc;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .status.success {
      border-color: rgba(20,125,103,0.25);
      background: #edfaf5;
      color: var(--green);
    }

    .status.error {
      border-color: rgba(199,68,77,0.25);
      background: #fff0f0;
      color: var(--red);
    }

    .status.info {
      background: #eff6ff;
      border-color: rgba(23,105,224,0.25);
      color: var(--blue);
    }

    #results {
      margin-top: 18px;
      min-height: 120px;
    }

    .result-card {
      background: #f9fbff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--ink);
    }

    .result-card h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .result-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
    }

    .result-list li + li {
      margin-top: 8px;
    }

    @media (max-width: 640px) {
      .button-row {
        flex-direction: column;
      }
      .button-row button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand" aria-label="RoadLens AI 品牌">
        <span class="brand-mark">R</span>
        <span>RoadLens AI</span>
      </div>
      <span class="badge">證據優先分析</span>
    </header>

    <section class="hero">
      <p class="eyebrow">RoadLens AI</p>
      <h1>智慧交通影像分析</h1>
      <p class="lead">上傳交通照片，AI 協助整理可見證據、判斷可能違規、並提供罰款估算範圍。</p>
    </section>

    <section class="panel">
      <div id="dropZone" class="upload-area" role="button" tabindex="0" aria-label="上傳影像區域">
        <div class="upload-icon">📸</div>
        <div class="upload-text">拖曳影像至此，或點選「選擇照片」</div>
      </div>

      <div class="button-row">
        <button id="chooseFileBtn" type="button" class="primary-btn">選擇照片</button>
        <button id="cameraBtn" type="button" class="secondary-btn">拍照</button>
        <button id="startAnalysisBtn" type="button" class="primary-btn" disabled>開始分析</button>
        <button id="clearBtn" type="button" class="ghost-btn">清空</button>
      </div>

      <input id="fileInput" class="hidden-input" type="file" accept="image/*" multiple>
      <input id="cameraInput" class="hidden-input" type="file" accept="image/*" capture="environment">

      <div id="fileList" aria-live="polite"></div>
      <div id="statusBox" class="status info">等待上傳照片。</div>
      <div id="results"></div>
    </section>
  </div>

  <script>
    'use strict';

    const state = { files: [] };

    const elements = {
      dropZone: document.getElementById('dropZone'),
      fileInput: document.getElementById('fileInput'),
      cameraInput: document.getElementById('cameraInput'),
      chooseFileBtn: document.getElementById('chooseFileBtn'),
      cameraBtn: document.getElementById('cameraBtn'),
      startAnalysisBtn: document.getElementById('startAnalysisBtn'),
      clearBtn: document.getElementById('clearBtn'),
      fileList: document.getElementById('fileList'),
      statusBox: document.getElementById('statusBox'),
      results: document.getElementById('results')
    };

    function setStatus(message, kind = 'info') {
      elements.statusBox.textContent = message;
      elements.statusBox.className = 'status ' + kind;
    }

    function readAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => resolve(event.target.result);
        reader.onerror = () => reject(new Error('讀取圖片失敗'));
        reader.readAsDataURL(file);
      });
    }

    function renderSelectedFiles() {
      if (!state.files.length) {
        elements.fileList.style.display = 'none';
        elements.fileList.innerHTML = '';
        elements.startAnalysisBtn.disabled = true;
        return;
      }

      const totalSize = state.files.reduce((sum, file) => sum + file.size, 0);
      elements.fileList.style.display = 'block';
      elements.fileList.innerHTML = state.files.map((file, index) => `
        <div class="file-item">
          <span>${index + 1}. ${file.name}</span>
          <span>${(file.size / 1024 / 1024).toFixed(1)} MB</span>
        </div>
      `).join('');

      elements.startAnalysisBtn.disabled = false;
      setStatus(`已選擇 ${state.files.length} 張照片，總大小 ${(totalSize / 1024 / 1024).toFixed(1)} MB。`, 'info');
    }

    function handleFiles(fileList) {
      const validFiles = Array.from(fileList || []).filter((file) => file.type.startsWith('image/')).slice(0, 6);
      if (!validFiles.length) {
        setStatus('請選擇有效的圖片檔案。', 'error');
        return;
      }

      state.files = validFiles;
      renderSelectedFiles();
    }

    function clearSelection() {
      state.files = [];
      elements.fileInput.value = '';
      elements.cameraInput.value = '';
      renderSelectedFiles();
      setStatus('已清空選擇。', 'info');
      elements.results.innerHTML = '';
    }

    function displayResult(result) {
      const violations = Array.isArray(result && result.violations) ? result.violations : [];
      const summary = result && result.summary ? result.summary : '未偵測到明顯違規。';

      if (!violations.length) {
        elements.results.innerHTML = `
          <div class="result-card">
            <h3>分析完成</h3>
            <p>${summary}</p>
          </div>
        `;
        return;
      }

      const items = violations.map((item, i) => `
        <li>
          <strong>${i + 1}. ${item.violation || '未知違規'}</strong><br>
          信心: ${item.confidence || 0}%<br>
          證據: ${item.evidence || '未提供'}
        </li>
      `).join('');

      elements.results.innerHTML = `
        <div class="result-card">
          <h3>分析結果</h3>
          <p>${summary}</p>
          <ul class="result-list">${items}</ul>
        </div>
      `;
    }

    async function startAnalysis() {
      if (!state.files.length) {
        setStatus('請先選擇照片。', 'error');
        return;
      }

      elements.startAnalysisBtn.disabled = true;
      setStatus('AI 正在分析照片，請稍候…', 'info');
      elements.results.innerHTML = '';

      try {
        const images = await Promise.all(state.files.map((file) => readAsDataUrl(file)));
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            images,
            mimeTypes: state.files.map((file) => file.type)
          })
        });

        const json = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(json.error || '分析失敗');
        }

        setStatus('分析完成。', 'success');
        displayResult(json);
      } catch (error) {
        setStatus(error.message || '分析失敗。', 'error');
        elements.results.innerHTML = `
          <div class="result-card">
            <h3>分析失敗</h3>
            <p>${error.message || '請稍後再試。'}</p>
          </div>
        `;
      } finally {
        elements.startAnalysisBtn.disabled = !state.files.length;
      }
    }

    function bindEvents() {
      elements.chooseFileBtn.addEventListener('click', () => {
        elements.fileInput.click();
      });

      elements.cameraBtn.addEventListener('click', () => {
        elements.cameraInput.click();
      });

      elements.fileInput.addEventListener('change', (event) => {
        handleFiles(event.target.files);
      });

      elements.cameraInput.addEventListener('change', (event) => {
        handleFiles(event.target.files);
      });

      elements.startAnalysisBtn.addEventListener('click', startAnalysis);
      elements.clearBtn.addEventListener('click', clearSelection);

      elements.dropZone.addEventListener('click', () => {
        elements.fileInput.click();
      });

      elements.dropZone.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          elements.fileInput.click();
        }
      });

      ['dragenter', 'dragover'].forEach((eventName) => {
        elements.dropZone.addEventListener(eventName, (event) => {
          event.preventDefault();
          elements.dropZone.classList.add('dragover');
        });
      });

      ['dragleave', 'drop'].forEach((eventName) => {
        elements.dropZone.addEventListener(eventName, (event) => {
          event.preventDefault();
          elements.dropZone.classList.remove('dragover');
        });
      });

      elements.dropZone.addEventListener('drop', (event) => {
        const files = event.dataTransfer && event.dataTransfer.files;
        handleFiles(files);
      });
    }

    bindEvents();
    renderSelectedFiles();
    setStatus('等待上傳照片。', 'info');
  </script>
</body>
</html>
